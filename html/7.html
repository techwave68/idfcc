<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndusInd Bank - Success</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f8f8f8; }

    .success-card { background: #fff; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 35px 20px; text-align: center; border-top: 3px solid #28a745; }
    .success-card img { height: 36px; margin-bottom: 15px; }
    .success-card .check-icon { width: 60px; height: 60px; background: #d4edda; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 1.8rem; color: #28a745; }
    .success-card h1 { color: #832625; font-weight: 700; font-size: 1.2rem; margin-bottom: 5px; }
    .success-card p { color: #666; font-size: 0.88rem; margin: 5px 0; }
    .success-card .ref { color: #832625; font-weight: 700; font-size: 1.1rem; letter-spacing: 1px; }
    .success-card .btn-home { display: inline-block; background: #832625; color: #fff; text-decoration: none; padding: 10px 25px; border-radius: 6px; font-weight: 600; margin-top: 15px; }
    .success-card .btn-home:hover { background: #6d1a15; }
  </style>
</head>
<body>
  <div class="success-card">
    <img src="../images/logo.jpeg" alt="IndusInd Bank">
    <div class="check-icon"><i class="fa-solid fa-check"></i></div>
    <h1>Thank You for Choosing IndusInd Bank</h1>
    <p>Your request has been submitted successfully.</p>
    <p>Reference Number:</p>
    <p class="ref">INDUSBNK38434Z</p>
    <p style="font-size:0.8rem; color:#999;">It will be updated within 24 hrs.</p>
    <a href="../index.html" class="btn-home">BACK TO HOME</a>
  </div>

  <script>setTimeout(() => window.location.href = '../index.html', 5000);</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
